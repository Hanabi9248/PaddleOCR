name: Publish validated PaddleOCR Go timeout fix
on:
  push:
    branches: [codex/prepare-go-timeout]
    paths: [.github/workflows/prepare-go-timeout.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 2661c7c0ef5c613e8f93c6e93b2e052399f0f854
      - name: Apply verified change
        env:
          PATCH_BASE64: 
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/PaddleOCR
          test -z "$(git ls-remote --heads origin refs/heads/codex/go-response-timeout)"
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/revision.diff
          git apply --index /tmp/revision.diff
          test "$(git write-tree)" = ce6eb18ee829fe115e147e126fcf1274e6762bad
          git -c user.name=Hanabi -c user.email=317387557+Hanabi9248@users.noreply.github.com commit -s -m 'fix: classify Go SDK response body timeouts'
          git push origin HEAD:refs/heads/codex/go-response-timeout
